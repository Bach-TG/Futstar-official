[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=76", "wheel"]

[project]
description = "Real-time football data aggregator with momentum calculation and WebSocket streaming"
license = {text = "MIT"}
name = "data-aggregator-v1"
readme = "README.md"
requires-python = ">=3.10,<3.12"
version = "0.1.0"

authors = [
  {name = "Yuki Minh", email = "your-email@example.com"},
]

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "aiohttp==3.11.18",
  "fastapi==0.115.12",
  "requests==2.32.3",
  "uvicorn>=0.34.2",
  "opentelemetry-api==1.33.1",
  "opentelemetry-sdk==1.33.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.33.1",
  "opentelemetry-instrumentation-fastapi==0.54b1",
  "opentelemetry-instrumentation-logging==0.54b1",
  "opentelemetry-instrumentation-aiohttp-client==0.54b1",
  "ujson==5.10.0",
  "beanie>=2.0.0",
  "pymongo>=4.14.1",
  "motor>=3.7.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "prefect>=3.4.16",
  "beautifulsoup4>=4.14.2",
  "curl-cffi>=0.13.0",
  "selenium>=4.37.0",
  "webdriver-manager>=4.0.2",
  "undetected-chromedriver>=3.5.5",
  "demjson3>=3.0.6",
  "pandas>=2.3.3",
  "matplotlib>=3.10.7",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
ignore = [
  ### Intentionally disabled
  # module level import not at top of file
  "E402", # line too long
  "E501", # do not assign a lambda expression, use a def
  "E731", # incorrect-dict-iterator, flags valid Series.items usage
  "PERF102", # try-except-in-loop, becomes useless in Python 3.11
  "PERF203",
]
select = [
  # Import sorting rules
  "I", # Pycodestyle rules (E, V)
  "E", # Tidy import rules
  "TID", # Perflint
  "PERF", # FastAPI specific rules
  "FAST",
]

[tool.uv]
concurrent-downloads = 10 # prevents uv from consuming all the CPU by concurrently downloading packages

[tool.basedpyright]
autoImportCompletions = true
pythonPlatform = "Linux"
pythonVersion = "3.10"
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnusedExpression = "hint"
reportUnusedImport = "hint"
reportUnusedParameter = "hint"
reportUnusedVariable = "hint"
typeCheckingMode = "recommended"
