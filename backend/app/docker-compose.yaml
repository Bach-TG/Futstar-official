version: "3.8"

services:
  futstar-redis:
    image: redis:alpine
    container_name: futstar-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - futstar_net

  futstar-redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: futstar-redis-commander
    restart: always
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:futstar-redis:6379
    networks:
      - futstar_net
    depends_on:
      - futstar-redis

  futstar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futstar-app
    restart: always
    ports:
      - "8234:8000"
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://futstar-redis:6379/0
    networks:
      - futstar_net

  caddy:
    image: caddy:latest
    container_name: futstar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - futstar_net

networks:
  futstar_net:

volumes:
  caddy_data:
  caddy_config:
  redis_data:
